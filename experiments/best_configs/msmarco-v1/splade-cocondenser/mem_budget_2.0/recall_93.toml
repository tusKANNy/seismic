name = "splade-cocondenser-mem_budget_2.0-recall_93"
title = "Seismic Splade-cocodenser - Recall 93%"
description = "Optimized configuration for splade-cocodenser targeting recall 93% from grid search"
dataset = "Splade-cocodenser on MS-MARCO"

[settings]
k = 10
n-runs = 1
build = true
metric = "RR@10"
delete = true

[folder]
data = "~/knn_datasets/sparse_datasets/msmarco_v1_passage/cocondenser/data"
index = "~/knn_indexes/sparse_datasets/msmarco_v1_passage/cocondenser/indexes"
qrels_path = "~/knn_datasets/sparse_datasets/msmarco_v1_passage/qrels.dev.small.tsv"
experiment = "."

[filename]
dataset = "documents.bin"
queries = "queries.bin"
groundtruth = "groundtruth.tsv"
doc_ids = "doc_ids.npy"
query_ids = "queries_ids.npy"
index = "splade-cocodenser_recall_93"

[indexing_parameters]
n-postings = 2000
centroid-fraction = 0.2
summary-energy = 0.5
knn = 0
clustering-algorithm = "random-kmeans-inverted-index-approx"
kmeans-doc-cut = 15
kmeans-pruning-factor = 0.0
max-fraction = 6.0
min-cluster-size = 2
pruning-strategy = "global-threshold"
value-type = "dotpacking8-scalaru8"

[query]

[query.recall_93]
query-cut = 4
heap-factor = 0.9
