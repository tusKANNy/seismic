name = "splade-cocondenser-mem_budget_0.9-recall_90"
title = "Seismic  - Recall 90%"
description = "Optimized configuration for  targeting recall 90% from grid search"
dataset = " on MS-MARCO"

[settings]
k = 10
n-runs = 1
build = true
metric = "RR@10"
delete = true

[folder]
data = "~/knn_datasets/sparse_datasets/msmarco_v1_passage/cocondenser/data"
index = "~/knn_indexes/sparse_datasets/msmarco_v1_passage/cocondenser/indexes"
qrels_path = "~/knn_datasets/sparse_datasets/msmarco_v1_passage/qrels.dev.small.tsv"
experiment = "."

[filename]
dataset = "documents.bin"
queries = "queries.bin"
groundtruth = "groundtruth.tsv"
doc_ids = "doc_ids.npy"
query_ids = "queries_ids.npy"
index = "_recall_90"

[indexing_parameters]
n-postings = 2000
centroid-fraction = 0.1
summary-energy = 0.4
knn = 0
clustering-algorithm = "random-kmeans-inverted-index-approx"
kmeans-doc-cut = 15
kmeans-pruning-factor = 0.0
max-fraction = 3.0
min-cluster-size = 5
pruning-strategy = "global-threshold"
value-type = "dotpacking8-scalaru8"

[query]

[query.recall_90]
query-cut = 7
heap-factor = 0.9
